<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900">
<rect width="1500" height="900" fill="#ffffff"/>
<text x="30" y="42" text-anchor="start" font-family="Arial" font-size="22" fill="#222" font-weight="bold">TeleArm — devre şeması</text>
<text x="30" y="66" text-anchor="start" font-family="Arial" font-size="13" fill="#555">Kırmızı: 5 V   ·   Turuncu: 3.3 V   ·   Siyah: GND   ·   Mavi: I²C   ·   Yeşil: ADC / buton   ·   Mor: PWM sinyali</text>
<rect x="40" y="100" width="230" height="90" rx="10" fill="#fbfbfb" stroke="#333" stroke-width="2"/>
<text x="155.0" y="124" text-anchor="middle" font-family="Arial" font-size="16" fill="#222" font-weight="bold">5 V / 10 A adaptör</text>
<text x="155.0" y="142" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">anahtarlamalı güç kaynağı</text>
<rect x="40" y="250" width="340" height="470" rx="10" fill="#fbfbfb" stroke="#333" stroke-width="2"/>
<text x="210.0" y="274" text-anchor="middle" font-family="Arial" font-size="16" fill="#222" font-weight="bold">ESP32-S3-WROOM-1</text>
<text x="210.0" y="292" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">N16R8 · Arduino çerçevesi · PlatformIO</text>
<text x="56" y="334" text-anchor="start" font-family="Arial" font-size="12.5" fill="#222">VIN  ← adaptör 5 V</text>
<circle cx="380" cy="330" r="4" fill="#c0392b"/>
<text x="56" y="364" text-anchor="start" font-family="Arial" font-size="12.5" fill="#222">3V3  → PCA9685 VCC ve pot uçları</text>
<circle cx="380" cy="360" r="4" fill="#e67e22"/>
<text x="56" y="394" text-anchor="start" font-family="Arial" font-size="12.5" fill="#222">GND  (yıldız noktası)</text>
<circle cx="380" cy="390" r="4" fill="#2c3e50"/>
<text x="56" y="444" text-anchor="start" font-family="Arial" font-size="12.5" fill="#222">GPIO1  ← pot taban (ADC)</text>
<circle cx="380" cy="440" r="4" fill="#27ae60"/>
<text x="56" y="470" text-anchor="start" font-family="Arial" font-size="12.5" fill="#222">GPIO2  ← pot omuz (ADC)</text>
<circle cx="380" cy="466" r="4" fill="#27ae60"/>
<text x="56" y="496" text-anchor="start" font-family="Arial" font-size="12.5" fill="#222">GPIO4  ← pot dirsek (ADC)</text>
<circle cx="380" cy="492" r="4" fill="#27ae60"/>
<text x="56" y="522" text-anchor="start" font-family="Arial" font-size="12.5" fill="#222">GPIO5  ← pot bilek (ADC)</text>
<circle cx="380" cy="518" r="4" fill="#27ae60"/>
<text x="56" y="570" text-anchor="start" font-family="Arial" font-size="12.5" fill="#222">GPIO6  ← buton (INPUT_PULLUP)</text>
<circle cx="380" cy="566" r="4" fill="#27ae60"/>
<text x="56" y="620" text-anchor="start" font-family="Arial" font-size="12.5" fill="#222">GPIO8  → I²C SDA</text>
<circle cx="380" cy="616" r="4" fill="#2980b9"/>
<text x="56" y="646" text-anchor="start" font-family="Arial" font-size="12.5" fill="#222">GPIO9  → I²C SCL</text>
<circle cx="380" cy="642" r="4" fill="#2980b9"/>
<rect x="520" y="250" width="260" height="250" rx="10" fill="#fbfbfb" stroke="#333" stroke-width="2"/>
<text x="650.0" y="274" text-anchor="middle" font-family="Arial" font-size="16" fill="#222" font-weight="bold">PCA9685</text>
<text x="650.0" y="292" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">16 kanal PWM · I²C 0x40 · 50 Hz</text>
<circle cx="520" cy="330" r="4" fill="#c0392b"/>
<text x="534" y="334" text-anchor="start" font-family="Arial" font-size="12" fill="#222">V+  ← adaptör 5 V (servo gücü)</text>
<circle cx="520" cy="360" r="4" fill="#e67e22"/>
<text x="534" y="364" text-anchor="start" font-family="Arial" font-size="12" fill="#222">VCC ← ESP 3V3 (mantık)</text>
<circle cx="520" cy="390" r="4" fill="#2c3e50"/>
<text x="534" y="394" text-anchor="start" font-family="Arial" font-size="12" fill="#222">GND ← yıldız noktası</text>
<circle cx="520" cy="440" r="4" fill="#2980b9"/>
<text x="534" y="444" text-anchor="start" font-family="Arial" font-size="12" fill="#222">SDA ← GPIO8</text>
<circle cx="520" cy="466" r="4" fill="#2980b9"/>
<text x="534" y="470" text-anchor="start" font-family="Arial" font-size="12" fill="#222">SCL ← GPIO9</text>
<path d="M270,145 L300,145 L300,246" fill="none" stroke="#c0392b" stroke-width="3"/>
<path d="M300,145 L500,145 L500,330 L520,330" fill="none" stroke="#c0392b" stroke-width="3"/>
<path d="M380,360 L520,360" fill="none" stroke="#e67e22" stroke-width="2.5"/>
<path d="M380,390 L500,390 L500,390 L520,390" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
<path d="M380,616 L460,616 L460,440 L520,440" fill="none" stroke="#2980b9" stroke-width="2.5"/>
<path d="M380,642 L480,642 L480,466 L520,466" fill="none" stroke="#2980b9" stroke-width="2.5"/>
<circle cx="780" cy="306" r="4" fill="#8e44ad"/>
<text x="790" y="302" text-anchor="start" font-family="Arial" font-size="12" fill="#8e44ad" font-weight="bold">CH0</text>
<path d="M780,306 L900,306" fill="none" stroke="#8e44ad" stroke-width="2.5"/>
<rect x="900" y="280" width="250" height="52" rx="8" fill="#fbfbfb" stroke="#333" stroke-width="1.6"/>
<text x="912" y="302" text-anchor="start" font-family="Arial" font-size="14" fill="#222" font-weight="bold">Kıskaç · SG90</text>
<text x="912" y="320" text-anchor="start" font-family="Arial" font-size="11" fill="#555">PWM sinyali · güç PCA9685 V+ üzerinden</text>
<circle cx="780" cy="376" r="4" fill="#8e44ad"/>
<text x="790" y="372" text-anchor="start" font-family="Arial" font-size="12" fill="#8e44ad" font-weight="bold">CH1</text>
<path d="M780,376 L900,376" fill="none" stroke="#8e44ad" stroke-width="2.5"/>
<rect x="900" y="350" width="250" height="52" rx="8" fill="#fbfbfb" stroke="#333" stroke-width="1.6"/>
<text x="912" y="372" text-anchor="start" font-family="Arial" font-size="14" fill="#222" font-weight="bold">Bilek · MG996R</text>
<text x="912" y="390" text-anchor="start" font-family="Arial" font-size="11" fill="#555">PWM sinyali · güç PCA9685 V+ üzerinden</text>
<circle cx="780" cy="446" r="4" fill="#8e44ad"/>
<text x="790" y="442" text-anchor="start" font-family="Arial" font-size="12" fill="#8e44ad" font-weight="bold">CH2</text>
<path d="M780,446 L900,446" fill="none" stroke="#8e44ad" stroke-width="2.5"/>
<rect x="900" y="420" width="250" height="52" rx="8" fill="#fbfbfb" stroke="#333" stroke-width="1.6"/>
<text x="912" y="442" text-anchor="start" font-family="Arial" font-size="14" fill="#222" font-weight="bold">Dirsek · MG996R</text>
<text x="912" y="460" text-anchor="start" font-family="Arial" font-size="11" fill="#555">PWM sinyali · güç PCA9685 V+ üzerinden</text>
<circle cx="780" cy="516" r="4" fill="#8e44ad"/>
<text x="790" y="512" text-anchor="start" font-family="Arial" font-size="12" fill="#8e44ad" font-weight="bold">CH4</text>
<path d="M780,516 L900,516" fill="none" stroke="#8e44ad" stroke-width="2.5"/>
<rect x="900" y="490" width="250" height="52" rx="8" fill="#fbfbfb" stroke="#333" stroke-width="1.6"/>
<text x="912" y="512" text-anchor="start" font-family="Arial" font-size="14" fill="#222" font-weight="bold">Taban · MG996R</text>
<text x="912" y="530" text-anchor="start" font-family="Arial" font-size="11" fill="#555">PWM sinyali · güç PCA9685 V+ üzerinden</text>
<circle cx="780" cy="586" r="4" fill="#8e44ad"/>
<text x="790" y="582" text-anchor="start" font-family="Arial" font-size="12" fill="#8e44ad" font-weight="bold">CH5</text>
<path d="M780,586 L900,586" fill="none" stroke="#8e44ad" stroke-width="2.5"/>
<rect x="900" y="560" width="250" height="52" rx="8" fill="#fbfbfb" stroke="#333" stroke-width="1.6"/>
<text x="912" y="582" text-anchor="start" font-family="Arial" font-size="14" fill="#222" font-weight="bold">Omuz · MG996R</text>
<text x="912" y="600" text-anchor="start" font-family="Arial" font-size="11" fill="#555">PWM sinyali · güç PCA9685 V+ üzerinden</text>
<text x="900" y="680" text-anchor="start" font-family="Arial" font-size="12" fill="#555">Servo gücü adaptörden PCA9685 V+ üzerinden gelir.</text>
<rect x="40" y="740" width="1420" height="120" rx="10" fill="#fbfbfb" stroke="#333" stroke-width="2"/>
<text x="750" y="766" text-anchor="middle" font-family="Arial" font-size="16" fill="#222" font-weight="bold">Ana kol (master): 4 potansiyometre ve buton</text>
<text x="750" y="786" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Her potansiyometre: bir uç 3V3, öbür uç GND, orta uç (wiper) ilgili ADC pinine.</text>
<circle cx="200" cy="820" r="20" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
<text x="200" y="825" text-anchor="middle" font-family="Arial" font-size="12" fill="#222" font-weight="bold">TA</text>
<text x="200" y="856" text-anchor="middle" font-family="Arial" font-size="12" fill="#27ae60">taban · GPIO1</text>
<circle cx="500" cy="820" r="20" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
<text x="500" y="825" text-anchor="middle" font-family="Arial" font-size="12" fill="#222" font-weight="bold">OM</text>
<text x="500" y="856" text-anchor="middle" font-family="Arial" font-size="12" fill="#27ae60">omuz · GPIO2</text>
<circle cx="800" cy="820" r="20" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
<text x="800" y="825" text-anchor="middle" font-family="Arial" font-size="12" fill="#222" font-weight="bold">DI</text>
<text x="800" y="856" text-anchor="middle" font-family="Arial" font-size="12" fill="#27ae60">dirsek · GPIO4</text>
<circle cx="1100" cy="820" r="20" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
<text x="1100" y="825" text-anchor="middle" font-family="Arial" font-size="12" fill="#222" font-weight="bold">BI</text>
<text x="1100" y="856" text-anchor="middle" font-family="Arial" font-size="12" fill="#27ae60">bilek · GPIO5</text>
<text x="1300" y="825" text-anchor="middle" font-family="Arial" font-size="13" fill="#27ae60" font-weight="bold">Buton → GPIO6</text>
<text x="1300" y="845" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">INPUT_PULLUP · basılı = aç</text>
</svg>